[package]
name = "marginalia-node-speakers"
version = "0.1.0"
edition = "2021"
description = "Tells speakers apart on a recording for marginalia-node (sherpa-onnx). A separate program on purpose, see src/main.rs"
license = "MIT"
publish = false

[[bin]]
name = "marginalia-node-speakers"
path = "src/main.rs"

[dependencies]
# Linked in statically. Nothing else to install.
sherpa-onnx = { version = "=1.13.8" }
serde_json = "1"
