[package]
name = "marginalia"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Local-first meeting notes, transcription and knowledge assistant (GPUI + llama.cpp + whisper.cpp)"
license = "Apache-2.0"

[[bin]]
name = "marginalia"
path = "src/main.rs"

[features]
default = ["cuda", "llama"]
# llama.cpp engine for chat and embeddings (the Android build serves both from LiteRT-LM instead).
llama = []
cuda = ["llama-cpp-2/cuda"]
vulkan = ["llama-cpp-2/vulkan"]

[dependencies]
# UI
gpui-kit = "0.7.2"
smol = "2"

# Local inference
llama-cpp-2 = { version = "=0.1.159", default-features = false, features = ["common", "openmp", "mtmd"] }
llama-cpp-sys-2 = { version = "=0.1.159", default-features = false }
# whisper.cpp is compiled by build.rs against llama.cpp's ggml (see vendor/whisper.cpp).

# Audio
cpal = "0.18"
symphonia = { version = "0.6", features = ["mp3", "aac", "isomp4"] }

# Storage + search
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1"

# Documents
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
html2text = "0.17"
rfd = "0.17"
ureq = { version = "3", features = ["rustls"] }

# Misc
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
crossbeam-channel = "0.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
dirs = "7"
blake3 = "1"
regex = "1"
unicode-segmentation = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[build-dependencies]
cc = { version = "1", features = ["parallel"] }
bindgen = "0.72"

[patch.crates-io]
# The published llama-cpp-sys-2 bundles a llama.cpp that predates the
# `gemma-embedding2` architecture (EmbeddingGemma 2). We vendor the same crate
# with a fresh llama.cpp checkout so EmbeddingGemma 2 loads in-process.
llama-cpp-sys-2 = { path = "vendor/llama-cpp-sys-2" }

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = 1
codegen-units = 16
incremental = true
